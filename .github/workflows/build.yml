name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no token left in .git/config for the steps below
      - name: Swift version
        run: swift --version
      - name: Release check
        run: sh scripts/release-check.sh
      - name: Lint
        env:
          # SwiftLint pinned: the release's portable binary, checked against the SHA-256 GitHub lists for the asset
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict
      - name: Build
        run: swift build
      - name: Test
        run: |
          # With only the Command Line Tools selected, swift-testing needs its macro plugin path; Xcode finds it itself.
          PLUGINS=/Library/Developer/CommandLineTools/usr/lib/swift/host/plugins/testing
          if xcode-select -p | grep -q CommandLineTools && [ -d "$PLUGINS" ]; then
            swift test -Xswiftc -plugin-path -Xswiftc "$PLUGINS"
          else
            swift test
          fi
