# SPDX-License-Identifier: MIT
# A pushed version tag builds the release on GitHub's machines with scripts/build-app.sh, records a signed build
# provenance for the zip (GitHub artifact attestation, checkable with `gh attestation verify`), and opens a draft release
# with the zip, its SHA-256, the SBOM and the provenance bundle. The draft is published by hand after the zip has been
# tried on a clean Mac. Every action is pinned by commit.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write        # to open the draft release
      id-token: write        # to sign the provenance
      attestations: write    # to store it with GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $GITHUB_REF_NAME is not a version"; exit 1; }
          sh scripts/build-app.sh "$V"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/tokenpanda-${{ env.V }}.zip
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "build/tokenpanda-$V.zip.intoto.jsonl"
          # the notes are the version's own section of CHANGELOG.md
          awk -v v="$V" '$0 ~ "^## "v"," {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "tokenpanda $V" --notes-file "$RUNNER_TEMP/notes.md" \
            "build/tokenpanda-$V.zip" "build/tokenpanda-$V.zip.sha256" "build/tokenpanda-$V.cdx.json" "build/tokenpanda-$V.zip.intoto.jsonl"
