# Weekly update offers for the pinned GitHub Actions and for Swift packages (there are none today; the entry
# makes a new one get offers from its first day).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7        # a new version waits a week before it is offered
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7        # a new version waits a week before it is offered
